http:
  routers:
    auth-web:
      entryPoints:
      - web
      rule: Path(`/api/authService`) || PathPrefix(`/api/authService/`)
      priority: 100
      service: auth
      middlewares:
      - security
      - bounded-body
      - remove-client-request-id
      - auth-prefix
    auth-websecure:
      entryPoints:
      - websecure
      rule: Path(`/api/authService`) || PathPrefix(`/api/authService/`)
      priority: 100
      service: auth
      middlewares:
      - security
      - bounded-body
      - remove-client-request-id
      - auth-prefix
      tls: {}
    accounts-web:
      entryPoints:
      - web
      rule: Path(`/api/accountsService`) || PathPrefix(`/api/accountsService/`)
      priority: 100
      service: accounts
      middlewares:
      - security
      - bounded-body
      - remove-client-request-id
      - accounts-prefix
    accounts-websecure:
      entryPoints:
      - websecure
      rule: Path(`/api/accountsService`) || PathPrefix(`/api/accountsService/`)
      priority: 100
      service: accounts
      middlewares:
      - security
      - bounded-body
      - remove-client-request-id
      - accounts-prefix
      tls: {}
    virtual-money-web:
      entryPoints:
      - web
      rule: Path(`/api/virtualMoney`) || PathPrefix(`/api/virtualMoney/`)
      priority: 100
      service: virtual-money
      middlewares:
      - security
      - bounded-body
      - remove-client-request-id
      - virtual-money-prefix
    virtual-money-websecure:
      entryPoints:
      - websecure
      rule: Path(`/api/virtualMoney`) || PathPrefix(`/api/virtualMoney/`)
      priority: 100
      service: virtual-money
      middlewares:
      - security
      - bounded-body
      - remove-client-request-id
      - virtual-money-prefix
      tls: {}
    poker-web:
      entryPoints:
      - web
      rule: Path(`/api/pokerService`) || PathPrefix(`/api/pokerService/`)
      priority: 100
      service: poker
      middlewares:
      - security
      - bounded-body
      - remove-client-request-id
      - poker-prefix
    poker-websecure:
      entryPoints:
      - websecure
      rule: Path(`/api/pokerService`) || PathPrefix(`/api/pokerService/`)
      priority: 100
      service: poker
      middlewares:
      - security
      - bounded-body
      - remove-client-request-id
      - poker-prefix
      tls: {}
    crypto-web:
      entryPoints:
      - web
      rule: Path(`/api/cryptoService`) || PathPrefix(`/api/cryptoService/`)
      priority: 100
      service: crypto
      middlewares:
      - security
      - bounded-body
      - remove-client-request-id
      - crypto-prefix
    crypto-websecure:
      entryPoints:
      - websecure
      rule: Path(`/api/cryptoService`) || PathPrefix(`/api/cryptoService/`)
      priority: 100
      service: crypto
      middlewares:
      - security
      - bounded-body
      - remove-client-request-id
      - crypto-prefix
      tls: {}
    website-web:
      entryPoints:
      - web
      rule: PathPrefix(`/`) && !(Path(`/api`) || PathPrefix(`/api/`) || PathPrefix(`/realtime`))
      priority: 1
      service: website
      middlewares:
      - security
      - bounded-body
    website-websecure:
      entryPoints:
      - websecure
      rule: PathPrefix(`/`) && !(Path(`/api`) || PathPrefix(`/api/`) || PathPrefix(`/realtime`))
      priority: 1
      service: website
      middlewares:
      - security
      - bounded-body
      tls: {}
  middlewares:
    security:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: no-referrer
        contentSecurityPolicy: 'default-src ''self''; script-src ''self'' ''wasm-unsafe-eval'';
          style-src ''self'' ''unsafe-inline''; img-src ''self'' data: blob:; font-src
          ''self''; connect-src ''self''; worker-src ''self'' blob:; object-src ''none'';
          base-uri ''self''; frame-ancestors ''none''; form-action ''self'''
        permissionsPolicy: camera=(), microphone=(), geolocation=()
        customResponseHeaders:
          Cross-Origin-Opener-Policy: same-origin
          Cross-Origin-Embedder-Policy: require-corp
          Cross-Origin-Resource-Policy: same-origin
    bounded-body:
      buffering:
        maxRequestBodyBytes: 1048576
        memRequestBodyBytes: 65536
    remove-client-request-id:
      headers:
        customRequestHeaders:
          X-Request-Id: ''
    auth-prefix:
      stripPrefix:
        prefixes:
        - /api/authService
    accounts-prefix:
      stripPrefix:
        prefixes:
        - /api/accountsService
    virtual-money-prefix:
      stripPrefix:
        prefixes:
        - /api/virtualMoney
    poker-prefix:
      stripPrefix:
        prefixes:
        - /api/pokerService
    crypto-prefix:
      stripPrefix:
        prefixes:
        - /api/cryptoService
  services:
    auth:
      loadBalancer:
        servers:
        - url: http://auth:8000
        passHostHeader: true
    accounts:
      loadBalancer:
        servers:
        - url: http://accounts:8000
        passHostHeader: true
    virtual-money:
      loadBalancer:
        servers:
        - url: http://virtual-money:8000
        passHostHeader: true
    poker:
      loadBalancer:
        servers:
        - url: http://poker:8000
        passHostHeader: true
    crypto:
      loadBalancer:
        servers:
        - url: http://crypto:8000
        passHostHeader: true
    website:
      loadBalancer:
        servers:
        - url: http://web:8080
        passHostHeader: true
tls:
  options:
    default:
      minVersion: VersionTLS13
