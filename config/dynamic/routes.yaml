http:
  routers:
    auth-web:
      entryPoints:
      - web
      rule: Header(`x-pokerlost-serviceId`, `authService`) && PathRegexp(`^/[a-z][A-Za-z0-9]*$`)
      priority: 100
      service: auth
      middlewares:
      - security
      - header-guard
      - bounded-body
    auth-websecure:
      entryPoints:
      - websecure
      rule: Header(`x-pokerlost-serviceId`, `authService`) && PathRegexp(`^/[a-z][A-Za-z0-9]*$`)
      priority: 100
      service: auth
      middlewares:
      - security
      - header-guard
      - bounded-body
      tls: {}
    accounts-web:
      entryPoints:
      - web
      rule: Header(`x-pokerlost-serviceId`, `accountsService`) && PathRegexp(`^/[a-z][A-Za-z0-9]*$`)
      priority: 100
      service: accounts
      middlewares:
      - security
      - header-guard
      - bounded-body
    accounts-websecure:
      entryPoints:
      - websecure
      rule: Header(`x-pokerlost-serviceId`, `accountsService`) && PathRegexp(`^/[a-z][A-Za-z0-9]*$`)
      priority: 100
      service: accounts
      middlewares:
      - security
      - header-guard
      - bounded-body
      tls: {}
    virtual-money-web:
      entryPoints:
      - web
      rule: Header(`x-pokerlost-serviceId`, `virtualMoney`) && PathRegexp(`^/[a-z][A-Za-z0-9]*$`)
      priority: 100
      service: virtual-money
      middlewares:
      - security
      - header-guard
      - bounded-body
    virtual-money-websecure:
      entryPoints:
      - websecure
      rule: Header(`x-pokerlost-serviceId`, `virtualMoney`) && PathRegexp(`^/[a-z][A-Za-z0-9]*$`)
      priority: 100
      service: virtual-money
      middlewares:
      - security
      - header-guard
      - bounded-body
      tls: {}
    poker-web:
      entryPoints:
      - web
      rule: Header(`x-pokerlost-serviceId`, `pokerService`) && PathRegexp(`^/[a-z][A-Za-z0-9]*$`)
      priority: 100
      service: poker
      middlewares:
      - security
      - header-guard
      - bounded-body
    poker-websecure:
      entryPoints:
      - websecure
      rule: Header(`x-pokerlost-serviceId`, `pokerService`) && PathRegexp(`^/[a-z][A-Za-z0-9]*$`)
      priority: 100
      service: poker
      middlewares:
      - security
      - header-guard
      - bounded-body
      tls: {}
    crypto-web:
      entryPoints:
      - web
      rule: Header(`x-pokerlost-serviceId`, `cryptoService`) && PathRegexp(`^/[a-z][A-Za-z0-9]*$`)
      priority: 100
      service: crypto
      middlewares:
      - security
      - header-guard
      - bounded-body
    crypto-websecure:
      entryPoints:
      - websecure
      rule: Header(`x-pokerlost-serviceId`, `cryptoService`) && PathRegexp(`^/[a-z][A-Za-z0-9]*$`)
      priority: 100
      service: crypto
      middlewares:
      - security
      - header-guard
      - bounded-body
      tls: {}
    website-web:
      entryPoints:
      - web
      rule: (Method(`GET`) || Method(`HEAD`)) && (Path(`/`, `/about`, `/game`, `/game/`,
        `/favicon.ico`, `/favicon.svg`, `/robots.txt`) || PathPrefix(`/assets/`, `/game/`))
      priority: 50
      service: website
      middlewares:
      - security
      - static-guard
      - bounded-body
    reject-web:
      entryPoints:
      - web
      rule: PathPrefix(`/`)
      priority: 1
      service: noop@internal
      middlewares:
      - security
      - reject-service
    website-websecure:
      entryPoints:
      - websecure
      rule: (Method(`GET`) || Method(`HEAD`)) && (Path(`/`, `/about`, `/game`, `/game/`,
        `/favicon.ico`, `/favicon.svg`, `/robots.txt`) || PathPrefix(`/assets/`, `/game/`))
      priority: 50
      service: website
      middlewares:
      - security
      - static-guard
      - bounded-body
      tls: {}
    reject-websecure:
      entryPoints:
      - websecure
      rule: PathPrefix(`/`)
      priority: 1
      service: noop@internal
      middlewares:
      - security
      - reject-service
      tls: {}
  middlewares:
    security:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: no-referrer
        contentSecurityPolicy: 'default-src ''self''; script-src ''self'' ''wasm-unsafe-eval'';
          style-src ''self'' ''unsafe-inline''; img-src ''self'' data: blob:; font-src
          ''self''; connect-src ''self''; worker-src ''self'' blob:; object-src ''none'';
          base-uri ''self''; frame-ancestors ''none''; form-action ''self'''
        permissionsPolicy: camera=(), microphone=(), geolocation=()
        customResponseHeaders:
          Cross-Origin-Opener-Policy: same-origin
          Cross-Origin-Embedder-Policy: require-corp
          Cross-Origin-Resource-Policy: same-origin
    bounded-body:
      buffering:
        maxRequestBodyBytes: 1048576
        memRequestBodyBytes: 65536
    header-guard:
      plugin:
        headerguard: {}
    static-guard:
      plugin:
        headerguard:
          static: true
    reject-service:
      plugin:
        headerguard:
          rejectUnknown: true
tls:
  options:
    default:
      minVersion: VersionTLS13
