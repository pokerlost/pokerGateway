global:
  checkNewVersion: false
  sendAnonymousUsage: false
api:
  dashboard: false
  insecure: false
entryPoints:
  web:
    address: :8080
    forwardedHeaders:
      insecure: false
    transport:
      respondingTimeouts:
        readTimeout: 30s
        writeTimeout: 0s
        idleTimeout: 120s
      lifeCycle:
        requestAcceptGraceTimeout: 2s
        graceTimeOut: 15s
  websecure:
    address: :8443
    forwardedHeaders:
      insecure: false
    transport:
      respondingTimeouts:
        readTimeout: 30s
        writeTimeout: 0s
        idleTimeout: 120s
      lifeCycle:
        requestAcceptGraceTimeout: 2s
        graceTimeOut: 15s
  ping:
    address: :8082
ping:
  entryPoint: ping
providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true
log:
  level: INFO
  format: json
accessLog:
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
serversTransport:
  forwardingTimeouts:
    dialTimeout: 5s
    responseHeaderTimeout: 30s
    idleConnTimeout: 90s
