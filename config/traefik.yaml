global:
  checkNewVersion: false
  sendAnonymousUsage: false
api:
  dashboard: false
  insecure: false
entryPoints:
  web:
    address: :8080
    forwardedHeaders:
      insecure: false
    transport:
      respondingTimeouts:
        readTimeout: 30s
        writeTimeout: 0s
        idleTimeout: 120s
      lifeCycle:
        requestAcceptGraceTimeout: 2s
        graceTimeOut: 15s
    http:
      encodedCharacters:
        allowEncodedSlash: false
        allowEncodedBackSlash: false
        allowEncodedNullCharacter: false
        allowEncodedSemicolon: false
        allowEncodedPercent: false
        allowEncodedQuestionMark: false
        allowEncodedHash: false
  websecure:
    address: :8443
    forwardedHeaders:
      insecure: false
    transport:
      respondingTimeouts:
        readTimeout: 30s
        writeTimeout: 0s
        idleTimeout: 120s
      lifeCycle:
        requestAcceptGraceTimeout: 2s
        graceTimeOut: 15s
    http:
      encodedCharacters:
        allowEncodedSlash: false
        allowEncodedBackSlash: false
        allowEncodedNullCharacter: false
        allowEncodedSemicolon: false
        allowEncodedPercent: false
        allowEncodedQuestionMark: false
        allowEncodedHash: false
  ping:
    address: :8082
ping:
  entryPoint: ping
providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true
log:
  level: INFO
  format: json
accessLog:
  format: json
  fields:
    defaultMode: drop
    names:
      StartUTC: keep
      Duration: keep
      DownstreamStatus: keep
      RequestMethod: keep
      RouterName: keep
      ServiceName: keep
    headers:
      defaultMode: drop
      names:
        X-Request-Id: keep
serversTransport:
  forwardingTimeouts:
    dialTimeout: 5s
    responseHeaderTimeout: 30s
    idleConnTimeout: 90s
experimental:
  localPlugins:
    headerguard:
      moduleName: github.com/pokerlost/headerguard
  abortOnPluginFailure: true
metrics:
  prometheus:
    entryPoint: ping
    addRoutersLabels: true
    addServicesLabels: true
