services:
  gateway:
    image: pokergateway:candidate
    pull_policy: never
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,size=32m]
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-18080}:8080"
      - "127.0.0.1:${GATEWAY_HTTPS_PORT:-18443}:8443"
    stop_grace_period: 20s
    networks: [platform]
networks:
  platform: {}
