name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/actionlint
      - name: Pin image timestamps to the reviewed commit
        run: make build-metadata >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Restore Docker static/unit/Helm toolchain
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile.quality
          target: quality
          load: true
          tags: pokergateway:quality
          cache-from: type=gha,scope=${{ github.repository_id }}-quality-python314-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
          cache-to: type=gha,mode=max,scope=${{ github.repository_id }}-quality-python314-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
      - name: Cached Traefik runtime image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          outputs: type=docker,rewrite-timestamp=true
          tags: pokergateway:candidate
          build-args: |
            SOURCE_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
            APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha,scope=${{ github.repository_id }}-gateway-runtime-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
          cache-to: type=gha,scope=${{ github.repository_id }}-gateway-runtime-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }},mode=max
      - name: Cached synthetic verification fixture
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: tests/Dockerfile
          load: true
          tags: pokergateway:fixture
          cache-from: type=gha,scope=${{ github.repository_id }}-gateway-fixture-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
          cache-to: type=gha,scope=${{ github.repository_id }}-gateway-fixture-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }},mode=max
      - name: Install only the explicit host Docker lifecycle test driver
        uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with: {version: '0.12.15', enable-cache: true, cache-dependency-glob: uv.lock}
      - run: uv python install 3.14.7
      - name: Fresh actual HTTP TLS WS failure and drain acceptance
        run: make ci-local
      - name: Transfer the tested runtime, not an assumed shared daemon
        env: {SOURCE_SHA: '${{ github.event.pull_request.head.sha || github.sha }}'}
        run: |
          set -euo pipefail
          mkdir -p dist/verified
          cp coverage/tested-image-id.txt coverage/source-commit.txt dist/verified/
          test "$(cat dist/verified/source-commit.txt)" = "$SOURCE_SHA"
          docker save pokergateway:candidate | gzip --no-name > dist/verified/runtime-image.docker.tar.gz
          sha256sum dist/verified/runtime-image.docker.tar.gz > dist/verified/runtime-image.sha256
      - name: Export the tested graph with SBOM and provenance in the same workspace
        id: verified_oci
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          outputs: type=oci,dest=dist/verified/runtime-image.oci.tar,rewrite-timestamp=true
          tags: pokergateway:candidate
          build-args: |
            SOURCE_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
            APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha,scope=${{ github.repository_id }}-gateway-runtime-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
          sbom: true
          provenance: mode=max
      - uses: oras-project/setup-oras@1c05fec4b9f67b83327bffb24220a862f10c0216 # official ORAS, immutable source
        with:
          version: '1.3.5'
          url: https://github.com/oras-project/oras/releases/download/v1.3.5/oras_1.3.5_linux_amd64.tar.gz
          checksum: f48a73ea6d026a862c3919fc773da9a8c86fc259c2c737d5baed3b8b9614ad22
      - name: Bind the attested OCI graph to the exact freshly tested configuration
        env:
          OCI_ROOT_DIGEST: ${{ steps.verified_oci.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$OCI_ROOT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          config_id="$(oras manifest fetch --oci-layout --platform linux/amd64 "dist/verified/runtime-image.oci.tar@$OCI_ROOT_DIGEST" | jq -r .config.digest)"
          test "$config_id" = "$(cat dist/verified/tested-image-id.txt)"
          printf '%s\n' "$OCI_ROOT_DIGEST" > dist/verified/runtime-image.oci-digest.txt
          cd dist/verified
          sha256sum runtime-image.oci.tar > runtime-image.oci.sha256
      - run: cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gateway-checks-${{ github.event.pull_request.head.sha || github.sha }}
          path: coverage/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gateway-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
  required:
    if: always()
    needs: [gateway]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env: {RESULT: '${{ needs.gateway.result }}'}
        run: test "$RESULT" = success
