name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/actionlint
      - uses: ./.github/actions/deployment-tools
      - uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with: {version: '0.12.15', enable-cache: true, cache-dependency-glob: uv.lock}
      - run: uv python install 3.14
      - run: make install lint typecheck test-unit chart
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Cached Traefik runtime image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          load: true
          tags: pokergateway:candidate
          build-args: SOURCE_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha,scope=gateway-runtime-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
          cache-to: type=gha,scope=gateway-runtime-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }},mode=max
      - name: Cached synthetic verification fixture
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: tests/Dockerfile
          load: true
          tags: pokergateway:fixture
          cache-from: type=gha,scope=gateway-fixture-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }}
          cache-to: type=gha,scope=gateway-fixture-linux-amd64-${{ github.event_name == 'pull_request' && 'review' || 'trusted' }},mode=max
      - name: Fresh actual HTTP TLS WS failure and shutdown tests
        run: uv run --locked pytest tests/test_proxy.py --junitxml=coverage/proxy.xml
      - name: Record the exact freshly tested runtime configuration
        run: docker image inspect pokergateway:candidate --format '{{.Id}}' > coverage/tested-image-id.txt
      - name: Chart and proxy test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gateway-checks-${{ github.sha }}
          path: |
            dist/
            coverage/
          retention-days: 14
          if-no-files-found: error
  publish-reviewed-runtime:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.GATEWAY_IMAGE_REVIEWED_SHA == github.event.pull_request.head.sha
    needs: [gateway]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "gateway-checks-$GITHUB_SHA" --dir "$RUNNER_TEMP/gateway-checks"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/registry-auth" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Resolve cached inputs and require the freshly tested configuration before publication
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          load: true
          tags: pokergateway:publish-candidate
          build-args: SOURCE_COMMIT=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=gateway-runtime-linux-amd64-review
      - name: Compare the candidate configuration with this run's proxy test record
        run: |
          set -euo pipefail
          expected=$(cat "$RUNNER_TEMP/gateway-checks/coverage/tested-image-id.txt")
          test "$(docker image inspect pokergateway:publish-candidate --format '{{.Id}}')" = "$expected"
      - name: Authenticate to the approved private registry
        env: {REGISTRY_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          chmod 700 "$DOCKER_CONFIG"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Export the reviewed development candidate with provenance and SBOM
        id: publish
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: ghcr.io/pokerlost/pokergateway:sha-${{ github.event.pull_request.head.sha }}
          build-args: SOURCE_COMMIT=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=gateway-runtime-linux-amd64-review
          cache-to: type=gha,scope=gateway-runtime-linux-amd64-review,mode=max
          sbom: true
          provenance: mode=max
      - name: Require exact tested image identity and private package visibility
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/pokerlost/pokergateway@$IMAGE_DIGEST"
          docker buildx imagetools inspect "$image" --raw > "$RUNNER_TEMP/published-index.json"
          child=$(python3 -c 'import json,os; from pathlib import Path; data=json.loads((Path(os.environ["RUNNER_TEMP"])/"published-index.json").read_text()); matches=[m["digest"] for m in data["manifests"] if m.get("platform")=={"architecture":"amd64","os":"linux"}]; assert len(matches)==1,matches; print(matches[0])')
          docker buildx imagetools inspect "ghcr.io/pokerlost/pokergateway@$child" --raw > "$RUNNER_TEMP/published-manifest.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          tested = (Path(os.environ['RUNNER_TEMP']) / 'gateway-checks/coverage/tested-image-id.txt').read_text().strip()
          published = json.loads((Path(os.environ['RUNNER_TEMP']) / 'published-manifest.json').read_text())
          assert published['config']['digest'] == tested, (published['config']['digest'], tested)
          PYTHON
          test "$(gh api orgs/pokerlost/packages/container/pokergateway --jq .visibility)" = private
          printf 'ghcr.io/pokerlost/pokergateway@%s\n' "$IMAGE_DIGEST" | tee "$RUNNER_TEMP/gateway-image-reference.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gateway-image-reference-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/gateway-image-reference.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove ephemeral registry authentication
        if: always()
        run: rm -rf "$RUNNER_TEMP/registry-auth"
  required:
    if: always()
    needs: [gateway, publish-reviewed-runtime]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results['gateway']['result'] == 'success', results
          publication = results['publish-reviewed-runtime']['result']
          assert publication == 'success' or (os.environ['EVENT'] == 'push' and publication == 'skipped'), results
          PYTHON
