name: Reviewed gateway delivery
on:
  workflow_dispatch:
    inputs:
      reviewed_sha: {description: Exact reviewed full gateway SHA, required: true, type: string}
      verified_run_id: {description: Successful CI run for that exact SHA, required: true, type: string}
permissions:
  contents: read
concurrency:
  group: gateway-delivery-${{ inputs.reviewed_sha }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.actor == 'serrja' && github.triggering_actor == 'serrja' && inputs.reviewed_sha == github.sha && inputs.reviewed_sha == vars.GATEWAY_IMAGE_REVIEWED_SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.reviewed_sha }}
      - name: Download the successful exact-SHA CI candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          VERIFIED_RUN: ${{ inputs.verified_run_id }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERIFIED_RUN" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = true
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" --jq '[.head_sha,.conclusion,.path,.head_repository.full_name] | @tsv')
          test "$run" = "$(printf '%s\tsuccess\t.github/workflows/ci.yml\t%s' "$REVIEWED_SHA" "$GITHUB_REPOSITORY")"
          gh run download "$VERIFIED_RUN" --repo "$GITHUB_REPOSITORY" --name "gateway-candidate-$REVIEWED_SHA" --dir "$RUNNER_TEMP/gateway-candidate"
          mkdir -p "$RUNNER_TEMP/gateway-checks/coverage"
          cp "$RUNNER_TEMP/gateway-candidate/verified/tested-image-id.txt" "$RUNNER_TEMP/gateway-checks/coverage/"
          test "$(cat "$RUNNER_TEMP/gateway-candidate/verified/source-commit.txt")" = "$REVIEWED_SHA"
          docker load --input "$RUNNER_TEMP/gateway-candidate/verified/runtime-image.docker.tar.gz"
          test "$(docker image inspect pokergateway:candidate --format '{{.Id}}')" = "$(cat "$RUNNER_TEMP/gateway-checks/coverage/tested-image-id.txt")"
          install -d -m 700 "$RUNNER_TEMP/registry-auth"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/registry-auth" >> "$GITHUB_ENV"
      - name: Pin image timestamps to the reviewed commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Resolve cached inputs and require the freshly tested configuration before publication
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          load: true
          tags: pokergateway:publish-candidate
          build-args: SOURCE_COMMIT=${{ inputs.reviewed_sha }}
          cache-from: type=gha,scope=${{ github.repository_id }}-gateway-runtime-linux-amd64-review
      - name: Compare the candidate configuration with this run's proxy test record
        run: |
          set -euo pipefail
          expected=$(cat "$RUNNER_TEMP/gateway-checks/coverage/tested-image-id.txt")
          test "$(docker image inspect pokergateway:publish-candidate --format '{{.Id}}')" = "$expected"
      - name: Authenticate to the approved private registry
        env: {REGISTRY_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          chmod 700 "$DOCKER_CONFIG"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Export the reviewed development candidate with provenance and SBOM
        id: publish
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: ghcr.io/pokerlost/pokergateway:sha-${{ inputs.reviewed_sha }}
          build-args: SOURCE_COMMIT=${{ inputs.reviewed_sha }}
          cache-from: type=gha,scope=${{ github.repository_id }}-gateway-runtime-linux-amd64-review
          cache-to: type=gha,scope=${{ github.repository_id }}-gateway-runtime-linux-amd64-review,mode=max
          sbom: true
          provenance: mode=max
      - name: Require exact tested image identity and private package visibility
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/pokerlost/pokergateway@$IMAGE_DIGEST"
          docker buildx imagetools inspect "$image" --raw > "$RUNNER_TEMP/published-index.json"
          docker pull "$image"
          test "$(docker image inspect "$image" --format '{{.Id}}')" = "$(cat "$RUNNER_TEMP/gateway-checks/coverage/tested-image-id.txt")"
          test "$(gh api orgs/pokerlost/packages/container/pokergateway --jq .visibility)" = private
          printf 'ghcr.io/pokerlost/pokergateway@%s\n' "$IMAGE_DIGEST" | tee "$RUNNER_TEMP/gateway-image-reference.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gateway-image-reference-${{ inputs.reviewed_sha }}
          path: ${{ runner.temp }}/gateway-image-reference.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove ephemeral registry authentication
        if: always()
        run: docker --config "$RUNNER_TEMP/registry-auth" logout ghcr.io
  result:
    if: always()
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require actual admitted publication
        env: {RESULT: '${{ needs.publish.result }}'}
        run: |
          test "$RESULT" = success || { echo 'Delivery admission or publication did not succeed; no delivery is verified.' >&2; exit 1; }
