{{- $root := . -}}
{{- range $name, $service := .Values.services }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $root.Release.Name }}-{{ $name | lower }}
spec:
  parentRefs: [{name: {{ $root.Release.Name }}}]
  {{- with $root.Values.hostnames }}
  hostnames: {{ toJson . }}
  {{- end }}
  rules:
    - matches:
        - path: {type: RegularExpression, value: "^/[a-z][A-Za-z0-9]*$"}
          headers:
            - {type: Exact, name: x-pokerlost-serviceId, value: {{ $name }}}
      filters:
        {{- range list "security" "header-guard" "bounded-body" }}
        - type: ExtensionRef
          extensionRef: {group: traefik.io, kind: Middleware, name: {{ $root.Release.Name }}-{{ . }}}
        {{- end }}
      backendRefs: [{name: {{ $service }}, port: 8000}]
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-web
spec:
  parentRefs: [{name: {{ .Release.Name }}}]
  {{- with .Values.hostnames }}
  hostnames: {{ toJson . }}
  {{- end }}
  rules:
    - matches:
        {{- range list "GET" "HEAD" }}
        {{- $method := . }}
        {{- range list "/" "/about" "/game" "/game/" "/favicon.ico" "/favicon.svg" "/robots.txt" }}
        - method: {{ $method }}
          path: {type: Exact, value: {{ . | quote }}}
        {{- end }}
        {{- range list "/assets/" "/game/" }}
        - method: {{ $method }}
          path: {type: PathPrefix, value: {{ . | quote }}}
        {{- end }}
        {{- end }}
      filters:
        {{- range list "security" "static-guard" "bounded-body" }}
        - type: ExtensionRef
          extensionRef: {group: traefik.io, kind: Middleware, name: {{ $root.Release.Name }}-{{ . }}}
        {{- end }}
      backendRefs: [{name: {{ .Values.webService }}, port: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-reject
spec:
  parentRefs: [{name: {{ .Release.Name }}}]
  {{- with .Values.hostnames }}
  hostnames: {{ toJson . }}
  {{- end }}
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      filters:
        - type: ExtensionRef
          extensionRef: {group: traefik.io, kind: Middleware, name: {{ .Release.Name }}-security}
        - type: ExtensionRef
          extensionRef: {group: traefik.io, kind: Middleware, name: {{ .Release.Name }}-reject-service}
      backendRefs: [{name: {{ .Values.webService }}, port: 8080}]
