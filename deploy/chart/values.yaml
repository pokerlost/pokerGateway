hostnames: []
tlsSecretName: ''
localDevelopment: false
webService: platform-web
services:
  authService: platform-auth
  accountsService: platform-accounts
  virtualMoney: platform-virtual-money
  pokerService: platform-poker
  cryptoService: platform-crypto
traefik:
  image:
    repository: ghcr.io/pokerlost/pokergateway
    tag: ''
    digest: null
  gateway:
    enabled: false
  gatewayClass:
    enabled: false
  ingressClass:
    enabled: false
  ingressRoute:
    dashboard:
      enabled: false
  api:
    dashboard: false
  providers:
    kubernetesIngress:
      enabled: false
    kubernetesCRD:
      enabled: true
      allowCrossNamespace: false
      namespaces:
      - foundation
    kubernetesGateway:
      enabled: true
      namespaces:
      - foundation
      experimentalChannel: false
  service:
    spec:
      type: ClusterIP
  ports:
    web:
      port: 8000
      exposedPort: 80
      forwardedHeaders:
        insecure: false
      transport:
        respondingTimeouts:
          readTimeout: 30s
          writeTimeout: 0s
          idleTimeout: 120s
        lifeCycle:
          requestAcceptGraceTimeout: 2s
          graceTimeOut: 15s
      http:
        encodedCharacters:
          allowEncodedSlash: false
          allowEncodedBackSlash: false
          allowEncodedNullCharacter: false
          allowEncodedSemicolon: false
          allowEncodedPercent: false
          allowEncodedQuestionMark: false
          allowEncodedHash: false
    websecure:
      port: 8443
      exposedPort: 443
      http:
        tls:
          enabled: false
        encodedCharacters:
          allowEncodedSlash: false
          allowEncodedBackSlash: false
          allowEncodedNullCharacter: false
          allowEncodedSemicolon: false
          allowEncodedPercent: false
          allowEncodedQuestionMark: false
          allowEncodedHash: false
      forwardedHeaders:
        insecure: false
  deployment:
    replicas: 1
    terminationGracePeriodSeconds: 25
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
      - ALL
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  additionalArguments:
  - --global.checknewversion=false
  - --global.sendanonymoususage=false
  - --experimental.localPlugins.headerguard.moduleName=github.com/pokerlost/headerguard
  - --experimental.abortOnPluginFailure=true
  log:
    format: json
    level: INFO
  accessLog:
    enabled: true
    format: json
    fields:
      defaultMode: drop
      names:
        StartUTC: keep
        Duration: keep
        DownstreamStatus: keep
        RequestMethod: keep
        RouterName: keep
        ServiceName: keep
      headers:
        defaultMode: drop
        names:
          X-Request-Id: keep
  metrics:
    prometheus:
      entryPoint: traefik
      addRoutersLabels: true
      addServicesLabels: true
  versionOverride: v3.7.15
